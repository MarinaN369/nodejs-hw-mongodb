tags:
  - Contacts
summary: Update contact by id
operationId: patchContact
description: 'Update contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
 content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: "John Doe"
            description: "The contact's name"
          phoneNumber:
            type: string
            example: "1234567890"
            description: "The contact's phone number"
          email:
            type: string
            example: "john.doe@example.com"
            description: "The contact's email address"
          isFavourite:
            type: boolean
            example: false
            description: "Whether the contact is marked as favourite"
          contactType:
            type: string
            example: "personal"
            description: "The type of contact (e.g., work, home, personal)"
            enum: [work, home, personal]
          photo:
            type: string
            example: "https://example.com/photo.jpg"
            description: "URL of the contact's photo"
        required:
          - name
          - phoneNumber
 required: false
responses:
  '200':
    description: 'Get contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact with id 65ca67e7ae7f10c88b598384!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '..\..\..\components\responses\404.yaml'
